<!DOCTYPE html>
<html>
<head>
    <title>Dashboard - Automated Testing & Deployment</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; background-color: #f8f9fa; }
        nav { background-color: #333; color: white; padding: 15px 30px; display: flex; justify-content: space-between; align-items: center; }
        nav h2 { margin: 0; font-size: 20px; }
        nav ul { list-style: none; margin: 0; padding: 0; display: flex; }
        nav ul li { margin-left: 20px; }
        nav ul li a { color: white; text-decoration: none; font-size: 16px; }
        .container { padding: 40px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        .logout-btn { background-color: #dc3545; color: white; border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <nav>
        <h2>Pipeline Dashboard</h2>
        <ul>
            <li><a href="#">Home</a></li>
            <li><button class="logout-btn" onclick="logout()">Logout</button></li>
        </ul>
    </nav>
    <div class="container">
        <div class="card">
            <h1>Welcome to Automated Testing & Deployment Portal</h1>
            <p>This web application is deployed via GitHub Actions.</p>
        </div>
    </div>
    <script>
        function logout() { window.location.href = "index.html"; }
    </script>
</body>
</html>
